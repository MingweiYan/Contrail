name: Web prebuilt release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish into; leave empty to build artifacts only"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: web-prebuilt-release-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  macos:
    name: Build macOS ${{ matrix.architecture }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build from source
        run: ./scripts/build_web_macos.command
      - name: Smoke-test the compiled service
        run: >-
          ./scripts/deploy_web_macos.command
          --skip-build
          --smoke-test
          --no-open
          --port 4182
      - name: Package the prebuilt release bundle
        run: >-
          ./scripts/package_prebuilt_web.sh
          --architecture ${{ matrix.architecture }}
          --output-dir dist
      - name: Start the prebuilt release bundle
        run: >-
          "./dist/Contrail-macOS-${{ matrix.architecture }}/Start Contrail.command"
          --no-open
          --port 4184
      - name: Verify the bounded log and stop the prebuilt release bundle
        run: |
          test -s "./dist/Contrail-macOS-${{ matrix.architecture }}/runtime/contrail.log"
          "./dist/Contrail-macOS-${{ matrix.architecture }}/Stop Contrail.command"
      - uses: actions/upload-artifact@v4
        with:
          name: contrail-web-macos-${{ matrix.architecture }}
          path: dist/Contrail-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error

  windows:
    name: Build Windows x64 bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build from source
        shell: cmd
        run: scripts\build_web_windows.cmd
      - name: Smoke-test the compiled service
        shell: cmd
        run: >-
          scripts\deploy_web_windows.cmd
          -SkipBuild
          -SmokeTest
          -NoOpen
          -Port 4183
      - name: Package the prebuilt release bundle
        shell: powershell
        run: >-
          .\scripts\package_prebuilt_web.ps1
          -Architecture x64
          -OutputDirectory dist
      - name: Start the prebuilt release bundle
        shell: cmd
        run: >-
          "dist\Contrail-Windows-x64\Start Contrail.cmd"
          -NoOpen
          -Port 4185
      - name: Verify the bounded log and stop the prebuilt release bundle
        shell: cmd
        run: |
          if not exist "dist\Contrail-Windows-x64\runtime\contrail.log" exit /b 1
          call "dist\Contrail-Windows-x64\Stop Contrail.cmd"
      - uses: actions/upload-artifact@v4
        with:
          name: contrail-web-windows-x64
          path: dist/Contrail-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish prebuilt bundles
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: contrail-web-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Contrail-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-assets/Contrail-*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
