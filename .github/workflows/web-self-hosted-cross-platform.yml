name: Cross-platform Web self-hosting

on:
  pull_request:
    paths:
      - ".github/workflows/web-self-hosted-cross-platform.yml"
      - ".github/workflows/web-prebuilt-release.yml"
      - "lib/**"
      - "server/**"
      - "scripts/deploy_web.sh"
      - "scripts/deploy_web.ps1"
      - "scripts/deploy_web_macos.command"
      - "scripts/deploy_web_windows.cmd"
      - "scripts/package_prebuilt_web.sh"
      - "scripts/package_prebuilt_web.ps1"
      - "scripts/release/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  macos:
    name: macOS ${{ matrix.architecture }} source and prebuilt deployment
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build, start, and health-check the integrated service
        run: >-
          ./scripts/deploy_web_macos.command
          --smoke-test
          --no-open
          --port 4182
      - name: Package the prebuilt release bundle
        run: >-
          ./scripts/package_prebuilt_web.sh
          --architecture ${{ matrix.architecture }}
          --output-dir dist
      - name: Start and health-check the prebuilt release bundle
        run: >-
          "./dist/Contrail-macOS-${{ matrix.architecture }}/Start Contrail.command"
          --smoke-test
          --no-open
      - name: Upload the prebuilt release bundle
        uses: actions/upload-artifact@v4
        with:
          name: contrail-web-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/Contrail-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows one-click deployment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build, start, and health-check the integrated service
        shell: cmd
        run: >-
          scripts\deploy_web_windows.cmd
          -SmokeTest
          -NoOpen
          -Port 4183
      - name: Package the prebuilt release bundle
        shell: powershell
        run: >-
          .\scripts\package_prebuilt_web.ps1
          -Architecture x64
          -OutputDirectory dist
      - name: Start and health-check the prebuilt release bundle
        shell: cmd
        run: >-
          "dist\Contrail-Windows-x64\Start Contrail.cmd"
          -SmokeTest
          -NoOpen
      - name: Upload the prebuilt release bundle
        uses: actions/upload-artifact@v4
        with:
          name: contrail-web-windows-x64-${{ github.sha }}
          path: dist/Contrail-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
