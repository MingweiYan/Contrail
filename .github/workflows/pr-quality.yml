name: PR Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  static-analysis:
    name: Changed code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check changed Dart files and analyzer baseline
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash scripts/ci/check_changed_dart.sh "$BASE_REF"

  dependency-audit:
    name: Dependency vulnerability audit
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write

  tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run tests
        run: flutter test --reporter compact

  web:
    name: Web release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Web release
        run: flutter build web --release --no-wasm-dry-run
      - name: Smoke test Web release
        run: bash scripts/ci/web_smoke.sh
      - name: Upload Web build and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrail-web-${{ github.sha }}
          path: |
            build/web
            build/web-smoke
          if-no-files-found: error
          retention-days: 7
