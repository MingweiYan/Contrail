name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches:
      - main
      - integration/all-prs-validation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build static demo
        run: >-
          flutter build web --release --no-wasm-dry-run
          --base-href /Contrail/
      - name: Verify static demo
        env:
          WEB_SMOKE_BASE_PATH: /Contrail/
          WEB_SMOKE_ARTIFACT_DIR: build/pages-smoke
          WEB_SMOKE_PORT: 4175
        run: bash scripts/ci/web_smoke.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
